<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section id="authScreen" class="card auth-card">
      <h1>Hospital Management System</h1>
      <p class="subtitle">Patient Login</p>

      <div id="loginForm">
        <label for="loginPhone">Phone</label>
        <input id="loginPhone" type="text" placeholder="Enter phone number" autocomplete="username">

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="Enter password" autocomplete="current-password">

        <button id="loginBtn" class="primary">Login</button>
        <p class="switch">New patient? <button id="showRegisterBtn" class="link-btn">Create Account</button></p>
      </div>

      <div id="registerForm" class="hidden">
        <p class="subtitle">Create Patient Account</p>

        <label for="registerName">Full Name</label>
        <input id="registerName" type="text" placeholder="Enter full name">

        <label for="registerPhone">Phone</label>
        <input id="registerPhone" type="text" placeholder="Enter phone number">

        <label for="registerPassword">Password</label>
        <input id="registerPassword" type="password" placeholder="Create password" autocomplete="new-password">

        <label for="registerAge">Age</label>
        <input id="registerAge" type="number" min="1" max="120" placeholder="Enter age">

        <label for="registerGender">Gender</label>
        <select id="registerGender">
          <option value="">Select gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>

        <label for="registerAddress">Address</label>
        <textarea id="registerAddress" rows="3" placeholder="Enter address"></textarea>

        <button id="registerBtn" class="primary">Create Account</button>
        <p class="switch">Already have an account? <button id="showLoginBtn" class="link-btn">Login</button></p>
      </div>
    </section>

    <section id="patientScreen" class="hidden">
      <header class="topbar">
        <div>
          <h1>Hospital Management System</h1>
          <p>Welcome, <span id="patientName"></span></p>
        </div>
        <button id="logoutBtn" class="secondary">Logout</button>
      </header>

      <section class="card booking-card">
        <h2>Request Appointment</h2>
        <p class="hint">Select a doctor, date and available time.</p>

        <div class="selectors">
          <div>
            <label for="doctorSelect">Doctor</label>
            <select id="doctorSelect">
              <option value="">Select doctor</option>
            </select>
          </div>
          <div>
            <label for="dateSelect">Date</label>
            <input id="dateSelect" type="date">
          </div>
        </div>

        <div id="doctorInfo" class="doctor-info hidden"></div>

        <h3>Available Time</h3>
        <div id="slots" class="slots">
          <p class="muted">Select a doctor and date.</p>
        </div>
      </section>
    </section>

    <div id="message" class="message hidden"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
